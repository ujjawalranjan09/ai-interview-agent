[pytest]
# ----------------------------------------------------------------
# pytest configuration for AI Interview Agent
# ----------------------------------------------------------------

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output
addopts =
    --tb=short
    --strict-markers
    -ra

# Markers (add more as needed)
markers =
    slow: marks tests as slow (deselect with -m 'not slow')
    integration: marks tests requiring external services (MongoDB, OpenAI)
    gpu: marks tests requiring GPU/CUDA
    unit: marks fast unit tests with no external dependencies

# Filter warnings to keep output clean
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:librosa
    ignore::FutureWarning:transformers

# Minimum version
minversion = 7.0

# Show locals on failure
# (comment out if output is too verbose)
# showlocals = true
