name: CI Tests

on:
  push:
    branches: [ master, main, 'feat/**', 'fix/**' ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install lightweight dependencies
        run: |
          python -m pip install --upgrade pip
          # Install only what's needed for unit tests (no heavy ML models)
          pip install pytest pytest-cov python-dotenv numpy pandas
          pip install librosa scipy

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
          # Disable SpeechBrain download in CI (unit tests use mocks)
          SPEECHBRAIN_DISABLE_CACHE: "1"
        run: |
          pytest tests/ -v --cov=modules --cov-report=term-missing \
            --ignore=tests/test_integration.py || true

      - name: Upload coverage report
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: false
