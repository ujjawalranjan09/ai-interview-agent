# ============================================================
# AI Interview Agent — Continuous Integration
# ============================================================
# Triggers:
#   - Every push to master or any feat/** branch
#   - Every pull request targeting master
#
# Jobs:
#   1. lint    — ruff + black --check (fast, < 30 s)
#   2. test    — pytest with coverage on Python 3.10 & 3.11
#   3. docker  — build Docker image (no push) to catch Dockerfile regressions
# ============================================================

name: CI

on:
  push:
    branches:
      - master
      - 'feat/**'
  pull_request:
    branches:
      - master

jobs:

  # ----------------------------------------------------------
  # Job 1: Lint (ruff + black)
  # ----------------------------------------------------------
  lint:
    name: Lint (ruff + black)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install lint tools
        run: pip install ruff black

      - name: Run ruff (fast linter)
        run: ruff check . --output-format=github

      - name: Run black (format check)
        run: black --check --diff .

  # ----------------------------------------------------------
  # Job 2: Tests (pytest + coverage)
  # ----------------------------------------------------------
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      # System libs needed by librosa / sounddevice / opencv
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            libsndfile1 \
            portaudio19-dev \
            libglib2.0-0 \
            libgl1-mesa-glx

      - name: Install Python dependencies (CI-optimised)
        run: |
          pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Download spaCy model
        run: python -m spacy download en_core_web_sm

      - name: Run pytest with coverage
        env:
          # Prevent any code from trying to open a real DB / API
          MONGODB_URI: mongodb://localhost:27017/test_db
          OPENAI_API_KEY: sk-fake-key-for-ci
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          pytest tests/ \
            --tb=short \
            --cov=modules \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=40 \
            -q

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.11'
        with:
          files: coverage.xml
          fail_ci_if_error: false
          verbose: false

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 7

  # ----------------------------------------------------------
  # Job 3: Docker build check
  # ----------------------------------------------------------
  docker:
    name: Docker build check
    runs-on: ubuntu-latest
    needs: test
    # Only run on master push or PRs — skip on feature branch pushes to save minutes
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ai-interview-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Build only — proves the Dockerfile is not broken
          load: false
