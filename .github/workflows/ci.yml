name: CI

on:
  push:
    branches: ["master", "feat/**"]
  pull_request:
    branches: ["master"]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install core dependencies
        run: |
          pip install --upgrade pip
          pip install ruff black pytest pytest-mock
          pip install pdfplumber spacy sentence-transformers chromadb
          pip install transformers torch --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Lint with ruff
        run: ruff check modules/ tests/ --select=E,F,W --ignore=E501

      - name: Check formatting with black
        run: black --check modules/ tests/

      - name: Run tests
        run: pytest tests/ -v --tb=short
